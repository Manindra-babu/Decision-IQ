<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Circuit Path Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tileBg)" stroke="url(#borderGrad)" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#centerGlow)" />

  <!-- Decision-IQ Circuit "D" Motif Group -->
  <g filter="url(#neonGlow)">
    
    <!-- === VERTICAL STEM (Career Milestone Spine & Neural Bus) === -->
    <!-- Main spine trunk -->
    <path d="M 184 136 L 184 376" stroke="url(#cyanBlueGrad)" stroke-width="9" stroke-linecap="round" />
    
    <!-- Parallel neural bus tracks branching outward -->
    <path d="M 184 190 C 160 210, 154 235, 154 256 C 154 277, 160 302, 184 322" 
          fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" opacity="0.9" />

    <path d="M 184 212 C 170 226, 168 242, 168 256 C 168 270, 170 286, 184 300" 
          fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- Stem Nodes (Career Milestones) -->
    <circle cx="154" cy="256" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <circle cx="168" cy="242" r="4.5" fill="#22d3ee" />
    <circle cx="168" cy="270" r="4.5" fill="#22d3ee" />
    <circle cx="184" cy="226" r="5" fill="#ffffff" />
    <circle cx="184" cy="256" r="6" fill="#ffffff" />
    <circle cx="184" cy="286" r="5" fill="#ffffff" />

    <!-- === CURVED DECISION PATHWAYS (The Loop of 'D') === -->
    
    <!-- Outer Track: Primary Trajectory Path -->
    <path d="M 184 136 
             C 240 136, 368 152, 368 256 
             C 368 360, 240 376, 184 376" 
          fill="none" stroke="url(#cyanBlueGrad)" stroke-width="9" stroke-linecap="round" />

    <!-- Mid Track: Alternative Decision Route -->
    <path d="M 194 164 
             C 244 164, 332 178, 332 256 
             C 332 334, 244 348, 194 348" 
          fill="none" stroke="url(#purpleGrad)" stroke-width="6.5" stroke-linecap="round" opacity="0.95" />

    <!-- Inner Track: Accelerated Growth Route -->
    <path d="M 204 194 
             C 246 194, 294 206, 294 256 
             C 294 306, 246 318, 204 318" 
          fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Branching Interconnections (Decision Bridges) -->
    <line x1="306" y1="202" x2="346" y2="190" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
    <line x1="294" y1="256" x2="332" y2="256" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
    <line x1="332" y1="256" x2="368" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="306" y1="310" x2="346" y2="322" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

    <!-- Pathway Nodes (Decision Points / Milestones) -->
    <!-- Outer Path Nodes -->
    <circle cx="260" cy="140" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <circle cx="340" cy="180" r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />
    <circle cx="368" cy="256" r="8" fill="#ffffff" stroke="#38bdf8" stroke-width="3" />
    <circle cx="340" cy="332" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
    <circle cx="260" cy="372" r="6" fill="#c084fc" stroke="#ffffff" stroke-width="2" />

    <!-- Mid Path Nodes -->
    <circle cx="270" cy="168" r="5" fill="#a855f7" />
    <circle cx="332" cy="256" r="6" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="270" cy="344" r="5" fill="#ec4899" />

    <!-- Inner Path Nodes -->
    <circle cx="250" cy="198" r="4.5" fill="#38bdf8" />
    <circle cx="294" cy="256" r="5.5" fill="#ffffff" />
    <circle cx="250" cy="314" r="4.5" fill="#a855f7" />

  </g>

  <!-- === IQ INTELLIGENCE SPARKS (Top-Left & Bottom-Left Junctions) === -->
  <!-- Top IQ Spark -->
  <g filter="url(#sparkGlow)" transform="translate(184, 136)">
    <!-- 4-point Diamond Star -->
    <path d="M 0 -22 Q 0 0, -22 0 Q 0 0, 0 22 Q 0 0, 22 0 Q 0 0, 0 -22 Z" fill="#ffffff" />
    <!-- Diagonal rays -->
    <path d="M -9 -9 L 9 9 M -9 9 L 9 -9" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>

  <!-- Bottom IQ Spark -->
  <g filter="url(#sparkGlow)" transform="translate(184, 376)">
    <!-- 4-point Diamond Star -->
    <path d="M 0 -20 Q 0 0, -20 0 Q 0 0, 0 20 Q 0 0, 20 0 Q 0 0, 0 -20 Z" fill="#ffffff" />
    <!-- Diagonal rays -->
    <path d="M -8 -8 L 8 8 M -8 8 L 8 -8" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="0" cy="0" r="3.5" fill="#c084fc" />
  </g>

  <!-- Central Intelligence Pulse Star (Inside Aperture) -->
  <g filter="url(#sparkGlow)" transform="translate(242, 256)">
    <path d="M 0 -10 Q 0 0, -10 0 Q 0 0, 0 10 Q 0 0, 10 0 Q 0 0, 0 -10 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="0" cy="0" r="2.5" fill="#22d3ee" />
  </g>

</svg>
